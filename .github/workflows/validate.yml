name: Validate
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: git ls-files '*.sh' -z | xargs -0 -r -n1 bash -n
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --locked --manifest-path mcp-server/Cargo.toml
      - run: cargo clippy --locked --manifest-path mcp-server/Cargo.toml --all-targets -- -D warnings
      - run: bash scripts/check-teamdef.sh
